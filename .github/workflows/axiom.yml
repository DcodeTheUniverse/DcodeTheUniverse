name: Axiom

# Builds the launcher, runs every JVM, Robolectric and screenshot test, and attaches the APK.
on:
  push:
    branches: [main, 'claude/**']
    paths: ['launcher/**', '.github/workflows/axiom.yml']
  pull_request:
    paths: ['launcher/**', '.github/workflows/axiom.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Tests (JVM, Robolectric, screenshots)
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Release APK (debug-signed here; the release key never leaves the owner's machine)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            launcher/app/build/reports/tests
            launcher/app/build/screens
          if-no-files-found: ignore

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: axiom-apk
          path: launcher/app/build/outputs/apk/release/*.apk
