name: Circle Suite (Circle ID + Vault)

on:
  push:
    paths: ["circle-suite/**", ".github/workflows/circle-suite.yml"]
  pull_request:
    paths: ["circle-suite/**", ".github/workflows/circle-suite.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circle-suite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.CIRCLE_SUITE_KEYSTORE_B64 }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CIRCLE_SUITE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit + UI (Robolectric) tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lintRelease

      - name: Build release APKs
        env:
          CIRCLE_SUITE_KEYSTORE_PASSWORD: ${{ secrets.CIRCLE_SUITE_KEYSTORE_PASSWORD }}
          CIRCLE_SUITE_KEY_ALIAS: ${{ secrets.CIRCLE_SUITE_KEY_ALIAS }}
          CIRCLE_SUITE_KEY_PASSWORD: ${{ secrets.CIRCLE_SUITE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: circle-suite-apks
          path: |
            circle-suite/circleid/build/outputs/apk/release/*.apk
            circle-suite/vault/build/outputs/apk/release/*.apk
